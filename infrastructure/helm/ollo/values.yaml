image:
  repository: ollo-server
  tag: latest
  pullPolicy: IfNotPresent

replicaCount: 2

service:
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  className: nginx
  host: staging.ollo.example
  tlsSecret: ollo-tls

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 1Gi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 20
  targetCPU: 60

env:
  OLLO_ENV: staging
  OTP_DEV_REVEAL: "false"
  DATABASE_DRIVER: postgresql
  REDIS_REQUIRED: "true"
  S3_REGION: eu-central-1
  S3_BUCKET: ollo-staging-attachments
  SMS_PROVIDER: twilio
  TURN_URLS: turn:turn.staging.ollo.example:3478

# Secrets are referenced, never stored in git.
existingSecret: ollo-secrets

slo:
  apiP99Ms: 250
  availability: "99.5"
