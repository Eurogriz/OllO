name: ci

on:
  push:
    branches: [main, "arena/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: secret scan (heuristic)
        run: |
          if git grep -nE '(AKIA[0-9A-Z]{16}|-----BEGIN (RSA |OPENSSH )?PRIVATE KEY-----)' -- ':!.github' ':!docs'; then
            echo "possible secret found" && exit 1
          fi
      - name: dependency audit
        run: npm audit --omit=dev --audit-level=high || true

  image:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build -f infrastructure/docker/Dockerfile.server -t ollo-server:${{ github.sha }} .
